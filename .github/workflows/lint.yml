name: linter

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # Pruefen, nicht korrigieren: die CI soll rot werden, wenn Format oder
      # Lint nicht stimmen, und nicht still in den Branch schreiben.
      - name: Pint
        run: vendor/bin/pint --test

      - name: Frontend format
        run: npm run format:check

      - name: Frontend lint
        run: npx eslint .

      - name: TypeScript
        run: npx vue-tsc --noEmit
